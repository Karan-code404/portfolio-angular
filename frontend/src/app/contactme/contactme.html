<div class="full-page-form">
  
  <button class="back-btn" (click)="closeForm()">
    &larr; Back to Portfolio
  </button>

  <div class="form-container">
    <h2 class="form-heading">Let's Work Together</h2>
    <p class="form-subtext">Fill out the details below and I'll get back to you as soon as possible.</p>

    <form class="premium-form" (submit)="onSubmit($event)">
      
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" placeholder="e.g. John Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" placeholder="e.g. john@company.com" required>
      </div>

      <div class="form-group">
        <label for="purpose">I am a...</label>
        <select id="purpose" required>
          <option value="" disabled selected>Select an option</option>
          <option value="recruiter">Recruiter / Hiring Manager</option>
          <option value="client">Client looking for a developer</option>
          <option value="developer">Fellow Developer</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message">What would you like to discuss?</label>
        <textarea id="message" rows="5" placeholder="Hi Karan, I am looking to hire..." required></textarea>
      </div>

      <button type="submit" class="submit-btn">Send Message</button>
      
    </form>
  </div>
</div>
